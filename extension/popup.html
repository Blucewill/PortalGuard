<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PortalGuard Shield</title>
  <style>
    body { margin: 0; width: 300px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; background: #f4f2ee; color: #141416; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #141416; color: #f4f2ee; font-weight: 700; }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    main { padding: 16px; }
    .status { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 0 0 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #1f8a55; }
    p { margin: 0 0 14px; color: #3a3b40; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 12px; padding: 10px 12px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: #7c7d83; }
    a { display: block; text-align: center; padding: 10px; border-radius: 999px; background: #141416; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt="" /> PortalGuard Shield</header>
  <main>
    <p class="status"><span class="dot"></span> Watching for risky permissions</p>
    <p>Before your wallet opens, Shield pauses unlimited approvals, “approve all NFTs” and Permit signatures, and checks the spender against the Portaldot Drainer Registry.</p>
    <div class="stats">
      <div class="stat"><b id="warned">0</b><span>warnings shown</span></div>
      <div class="stat"><b id="cancelled">0</b><span>requests cancelled</span></div>
    </div>
    <a href="http://localhost:4173/#scanner" target="_blank" rel="noreferrer">Open PortalGuard scanner</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
